name: Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    env:
      npm_config_msvs_version: 2022
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --testTimeout=15000

      - name: Verify SQLite native module
        run: npm run verify:sqlite

      - name: Build web application
        run: npm run build

      - name: Increment desktop version
        run: npm version patch --no-git-tag-version

      - name: Commit release version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump Windows desktop release version"
          $attempt = 0
          do {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $attempt++
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          } while ($attempt -lt 3)
          exit 1

      - name: Build and publish Windows installer
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
